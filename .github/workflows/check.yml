name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lovable skill copies match the general skills
        run: node scripts/sync-shared.mjs --check
